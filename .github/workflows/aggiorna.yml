    - cron: '10 5 * * *'     # 06:10 ora italiana (inverno)
    - cron: '40 12 * * 1-6'  # 13:40
    - cron: '40 16 * * *'    # 17:40
  workflow_dispatch:
  push:
    branches: [main]

