      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Installa strumenti
        run: |
          pip install playwright==1.48.0 cryptography==43.0.3
          python -m playwright install --with-deps chromium

      - name: Scarica compiti e verifiche da Mastercom
        env:
          MC_UTENTE: ${{ secrets.MC_UTENTE }}
          MC_PASSWORD: ${{ secrets.MC_PASSWORD }}
          APP_CODICE: ${{ secrets.APP_CODICE }}
        run: python scraper/aggiorna.py

      - name: Tieni attivo il programma
        run: |
          date -u +%F > stato.txt
          git config user.name "zaino-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stato.txt
          git diff --cached --quiet || (git commit -m "Controllo giornaliero" && git push)

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  pubblica:
    needs: aggiorna
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
